version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: school_postgres
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    container_name: school_backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=school_db;Username=postgres;Password=password123
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always

  frontend:
    build: ./frontend
    container_name: school_frontend
    ports:
      - "5173:80"
    restart: always

volumes:
  postgres_data: